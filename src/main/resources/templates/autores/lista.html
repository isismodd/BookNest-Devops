<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Autores | BookNest</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<nav class="navbar">

    <div class="navbar-container">

        <a class="logo" th:href="@{/}">
            <span class="logo-icon">📚</span>
            BookNest
        </a>

        <div class="nav-links">

            <a th:href="@{/}">
                Início
            </a>

            <a th:href="@{/autores}">
                Autores
            </a>

            <a th:href="@{/livros}">
                Livros
            </a>

            <form
                    class="logout-form"
                    th:action="@{/logout}"
                    method="post">

                <button
                        class="btn-logout"
                        type="submit">
                    Sair
                </button>

            </form>

        </div>

    </div>

</nav>

<main class="container">

    <div class="page-header">

        <div class="page-title">

            <h1>Autores</h1>

            <p>
                Gerencie os autores cadastrados na biblioteca.
            </p>

        </div>

        <a
                class="btn btn-primary"
                th:href="@{/autores/novo}">
            + Novo autor
        </a>

    </div>

    <div class="table-card">

        <div
                class="empty-state"
                th:if="${#lists.isEmpty(autores)}">

            Nenhum autor cadastrado ainda.

        </div>

        <table th:unless="${#lists.isEmpty(autores)}">

            <thead>

            <tr>
                <th>Nome</th>
                <th>Nacionalidade</th>
                <th>Data de nascimento</th>
                <th>Ações</th>
            </tr>

            </thead>

            <tbody>

            <tr th:each="autor : ${autores}">

                <td th:text="${autor.nome}">
                    George Orwell
                </td>

                <td th:text="${autor.nacionalidade}">
                    Britânica
                </td>

                <td th:text="${autor.dataNascimento}">
                    1903-06-25
                </td>

                <td>

                    <div class="actions">

                        <a
                                class="btn btn-secondary btn-small"
                                th:href="@{/autores/editar/{id}(id=${autor.id})}">
                            Editar
                        </a>

                        <form
                                th:action="@{/autores/excluir/{id}(id=${autor.id})}"
                                method="post"
                                onsubmit="return confirm('Deseja realmente excluir este autor?');">

                            <button
                                    class="btn btn-danger btn-small"
                                    type="submit">
                                Excluir
                            </button>

                        </form>

                    </div>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</main>

</body>
</html>
